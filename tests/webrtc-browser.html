<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prueba técnica local WebRTC</title>
<style>body{font:16px system-ui;background:#111e34;color:#e2ecff;padding:30px}button{padding:12px 20px;margin:15px 10px 15px 0}video,canvas{width:45%;border:1px solid #728ab0}pre{white-space:pre-wrap;background:#182f52;padding:20px}</style>
<h1>Prueba técnica WebRTC · vídeo sintético</h1><p>Prueba aislada: no captura pantallas ni supervisa usuarios. Dos pares locales, sin STUN/TURN ni servidores externos.</p><button id="start">Ejecutar prueba de medios</button><button id="stop" disabled>Detener prueba</button><div><canvas id="source" width="640" height="360"></canvas><video id="receiver" autoplay muted playsinline></video></div><pre id="result" role="status">Esperando prueba manual.</pre>
<script>
let sender,receiver,media,paint,stats;const out=document.querySelector('#result');
function stop(){clearInterval(paint);clearInterval(stats);media?.getTracks().forEach(track=>track.stop());sender?.close();receiver?.close();document.querySelector('#stop').disabled=true;document.querySelector('#start').disabled=false;out.textContent=JSON.stringify({state:'stopped',sender:sender?.connectionState,receiver:receiver?.connectionState,tracks:media?.getTracks().map(track=>track.readyState)},null,2);}
document.querySelector('#stop').onclick=stop;
document.querySelector('#start').onclick=async()=>{try{document.querySelector('#start').disabled=true;document.querySelector('#stop').disabled=false;const canvas=document.querySelector('#source'),context=canvas.getContext('2d');let frame=0;paint=setInterval(()=>{context.fillStyle=frame%2?'#254f91':'#193c73';context.fillRect(0,0,640,360);context.fillStyle='white';context.font='28px sans-serif';context.fillText('PRUEBA SINTÉTICA LOCAL',35,130);context.fillText('Fotograma '+frame++,35,200);},125);media=canvas.captureStream(8);sender=new RTCPeerConnection({iceServers:[]});receiver=new RTCPeerConnection({iceServers:[]});const toSender=[],toReceiver=[];sender.onicecandidate=event=>{if(event.candidate){if(receiver.remoteDescription)receiver.addIceCandidate(event.candidate).catch(fail);else toReceiver.push(event.candidate);}};receiver.onicecandidate=event=>{if(event.candidate){if(sender.remoteDescription)sender.addIceCandidate(event.candidate).catch(fail);else toSender.push(event.candidate);}};receiver.ontrack=event=>{document.querySelector('#receiver').srcObject=event.streams[0];};sender.addTransceiver(media.getVideoTracks()[0],{direction:'sendonly',streams:[media]});await sender.setLocalDescription(await sender.createOffer());await receiver.setRemoteDescription(sender.localDescription);for(const candidate of toReceiver)await receiver.addIceCandidate(candidate);await receiver.setLocalDescription(await receiver.createAnswer());await sender.setRemoteDescription(receiver.localDescription);for(const candidate of toSender)await sender.addIceCandidate(candidate);stats=setInterval(async()=>{const report=await receiver.getStats();let decoded=0,bytes=0,dtls='';report.forEach(entry=>{if(entry.type==='inbound-rtp'){decoded=entry.framesDecoded||0;bytes=entry.bytesReceived||0;}if(entry.type==='transport')dtls=entry.dtlsState;});out.textContent=JSON.stringify({test:'Vídeo sintético, no es captura de escritorio',sender:sender.connectionState,receiver:receiver.connectionState,dtls,framesDecoded:decoded,bytesReceived:bytes,iceServers:[],audio:false},null,2);},500);}catch(error){fail(error);}};
function fail(error){stop();out.textContent='ERROR: '+error.message;}
window.addEventListener('pagehide',stop);
</script></html>
